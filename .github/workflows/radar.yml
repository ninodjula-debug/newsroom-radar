name: Newsroom Radar

on:
  schedule:
    - cron: '5,20,35,50 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/fetch_news.py'
      - '.github/workflows/radar.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: newsroom-radar
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Preuzmi projekt
        uses: actions/checkout@v4

      - name: Postavi Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prikupi vijesti
        run: python scripts/fetch_news.py

      - name: Spremi nove vijesti
        run: |
          git config user.name "Newsroom Radar Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          if ! git diff --cached --quiet; then
            git commit -m "Update news"
            git push
          fi
