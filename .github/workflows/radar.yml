name: Newsroom Radar

on:
  schedule:
    - cron: '3,18,33,48 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/fetch_news.py'
      - '.github/workflows/radar.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: newsroom-radar
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Preuzmi projekt
        uses: actions/checkout@v4

      - name: Postavi Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prikupi vijesti
        run: python scripts/fetch_news.py

      - name: Spremi nove vijesti
        run: |
          git config user.name "Newsroom Radar Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          if ! git diff --cached --quiet; then
            git commit -m "Update news"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "Failed to push updated news after retries"
                exit 1
              fi
              sleep 3
            done
          fi
