<!DOCTYPE html>
<html lang="hr">
<head>

  <title>Newsroom Radar</title>

    body { font-family: Arial, sans-serif; background: #101827; color: white; margin: 0; padding: 40px 20px; }

    h1 { font-size: 38px; }
    .card { background: #1e293b; padding: 24px; border-radius: 12px; margin-top: 24px; }
    .status { color: #86efac; }
  </style>
</head>
<body>
  <main>
    <h1>NEWSROOM RADAR</h1>
    <p>Osobni AI urednički asistent</p>
    <div class="card">
      <h2>Dobro došao u Newsroom Radar</h2>
      <p class="status">✓ Početna stranica je spremna</p>
      <p>Uskoro ovdje stižu hrvatske i svjetske vijesti te prijedlozi novinarskih follow-upova.</p>
    </div>
  </main>
</body>
</html>
